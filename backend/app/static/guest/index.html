<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E7C86">
  <title>HostyTalk</title>
  <link rel="stylesheet" href="/static/guest/guest.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="hosty">Hosty</span><span class="talk">Talk</span></div>
    <select id="lang" aria-label="Language"></select>
  </header>

  <main>
    <section id="invite" class="card center">
      <p id="inviteText" class="business"></p>
      <p data-i18n="welcome"></p>
    </section>

    <!-- Giriş / kayıt: iki tarafın da hesabı olur -->
    <form id="authForm" class="card authForm hidden">
      <h3 id="authTitle"></h3>
      <input id="email" type="email" autocomplete="email" required>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <input id="displayName" autocomplete="name" maxlength="60" class="hidden">
      <p id="authError" class="error hidden"></p>
      <button type="submit" id="authSubmit" class="primary big"></button>
      <button type="button" id="authToggle" class="link"></button>
    </form>

    <section id="welcome" class="card center hidden">
      <p id="signedInAs" class="hint"></p>
      <button id="start" class="primary big" data-i18n="start"></button>
      <p class="hint" data-i18n="startHint"></p>
      <button type="button" id="changePw" class="link" data-i18n="changePassword"></button>
      <button type="button" id="logout" class="link" data-i18n="logout"></button>
    </section>

    <!-- Giriş yapılıyken şifre değiştirme (eski şifre sorulmaz) -->
    <form id="pwForm" class="card authForm hidden">
      <h3 data-i18n="changePassword"></h3>
      <p class="hint" data-i18n="pwHint"></p>
      <input id="newPw" type="password" autocomplete="new-password" minlength="6" required>
      <input id="newPw2" type="password" autocomplete="new-password" minlength="6" required>
      <p id="pwError" class="error hidden"></p>
      <p id="pwDone" class="hidden" data-i18n="pwChanged"></p>
      <button type="submit" id="pwSave" class="primary big" data-i18n="save"></button>
      <button type="button" id="pwCancel" class="link" data-i18n="back"></button>
    </form>

    <section id="closed" class="card center hidden">
      <p id="closedText"></p>
    </section>

    <section id="summary" class="card summary hidden"></section>

    <ol id="transcript" class="transcript"></ol>
  </main>

  <footer id="controls" class="controls hidden">
    <div id="status" class="status"></div>
    <button id="mic" class="mic" aria-label="Microphone">🎤</button>
    <div class="row">
      <form id="textForm" class="textForm">
        <input id="textInput" autocomplete="off" maxlength="500">
        <button type="submit" class="primary" data-i18n="send"></button>
      </form>
    </div>
  </footer>

  <audio id="player" playsinline></audio>
  <script src="/static/guest/guest.js"></script>
</body>
</html>
